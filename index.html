<style>
:root{
  --b:#123f70;--b-dark:#082f57;--b-mid:#15558d;--b-light:#eaf2fa;
  --r:#c6283d;--r-dark:#9d1f31;--r-light:#fbecef;
  --g:#197149;--g2:#eaf7ef;--ink:#172334;--mut:#687689;
  --line:#d8e1ea;--bg:#f3f6f9;--card:#fff;--gold:#b68a2c
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#eef3f8 0,#f7f9fb 260px,#f4f6f8 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:relative;background:linear-gradient(135deg,var(--b-dark) 0%,var(--b) 42%,var(--b-mid) 72%,var(--b-dark) 100%);color:#fff;padding:25px 18px 27px;box-shadow:0 8px 26px rgba(8,47,87,.18)}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#fff 0 33.33%,var(--b-mid) 33.33% 66.66%,var(--r) 66.66% 100%)}
.wrap,main,.tabs{max-width:1320px;margin:auto}
.header-brand{display:flex;align-items:center;gap:18px}.header-brand .header-logo{order:2;margin-left:auto}.header-brand .header-copy{order:1}.header-logo{width:190px;max-height:92px;object-fit:contain;object-position:left center;flex:0 0 auto}.header-copy{min-width:0}.champion-banner{max-width:760px;margin:18px auto 0;padding:13px 18px;border:1px solid rgba(182,138,44,.38);border-radius:12px;background:linear-gradient(135deg,#fffaf0,#fff);box-shadow:0 8px 22px rgba(20,52,82,.07);text-align:center}.champion-label{font-size:9px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}.champion-name{margin-top:3px;font-size:18px;font-weight:950;color:var(--b-dark)}.kicker{font-size:11px;font-weight:950;letter-spacing:.13em;text-transform:uppercase;opacity:.82}
h1{margin:5px 0 5px;font-size:clamp(26px,4vw,40px);letter-spacing:-.025em}
.sub{font-size:13px;opacity:.84}
.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:15px}
.btn{border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.11);color:white;border-radius:8px;padding:8px 13px;font-weight:850;cursor:pointer;transition:.18s}
.btn:hover{background:#fff;color:var(--b-dark)}
.state{margin-left:auto;font-size:12px}
.tabs{padding:18px 18px 0;display:flex;gap:7px;overflow:auto}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--b);border-radius:8px 8px 0 0;padding:10px 16px;font-weight:900;cursor:pointer;box-shadow:0 2px 8px rgba(25,49,77,.03)}
.tab.on{background:var(--b);border-color:var(--b);color:#fff;position:relative}
.tab.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--r)}
main{padding:14px 18px 42px}
.error{display:none;background:#fff1f0;border:1px solid #f1b7b2;color:#8b241c;border-radius:10px;padding:12px;margin-bottom:14px}
.rankingbox{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:18px;box-shadow:0 5px 18px rgba(20,52,82,.05)}
.rankingtitle{padding:11px 14px;font-size:13px;font-weight:950;color:#fff;background:linear-gradient(90deg,var(--b-dark),var(--b));border-bottom:3px solid var(--r)}
.rankingtable{width:100%}
.rankingrow{display:grid;grid-template-columns:55px minmax(220px,42%) 48px 48px 48px 48px 65px 60px 125px 145px;align-items:center;min-height:35px;border-top:1px solid #edf1f5;font-size:11px;text-align:center}
.rankingrow:first-child{border-top:0}
.rankinghead{background:#edf3f9;color:var(--b-dark);font-size:10px;font-weight:950;text-transform:uppercase}
.rankingrow>div{padding:7px 8px}
.rankteam{text-align:center;font-weight:900;color:var(--b)}
.ranknum,.rankpts{font-weight:950}
.small{font-size:10px;color:var(--mut)}
.round{display:flex;gap:9px;align-items:center;margin:22px 0 9px;padding-left:9px;border-left:4px solid var(--r)}
.round h2{font-size:19px;margin:0;color:var(--b-dark)}
.tag{background:var(--b-light);color:var(--b);font-size:10px;font-weight:900;padding:5px 8px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.match{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(20,52,82,.06)}
.match.done{border-color:#9bc9b0}
.mh{padding:12px 14px;background:linear-gradient(180deg,#fbfdff,#f4f8fb);border-bottom:1px solid var(--line)}
.teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.team{font-size:15px;font-weight:950;color:var(--b-dark)}
.team.r{text-align:right}
.winner{color:var(--g)}
.total{font-size:21px;font-weight:950;background:var(--b);color:#fff;padding:6px 11px;border-radius:8px;min-width:86px;text-align:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.win{margin-top:8px;background:var(--g2);color:#145d3b;border-left:4px solid var(--g);padding:7px 9px;border-radius:6px;font-size:11px;font-weight:900}
.games{padding:7px 14px 12px}
.game{display:grid;grid-template-columns:minmax(0,1fr) 112px minmax(0,1fr);gap:12px;align-items:center;border-top:1px solid #edf0f4;padding:10px 0;font-size:12px}
.game:first-child{border-top:0}
.game .r{text-align:right}
.mid{text-align:center;font-weight:950;color:var(--b-dark)}
.pts{display:block;color:var(--mut);font-size:9px;font-weight:750}
.draw{color:#8b6200}
.waiting{color:#9ca7b5;font-style:italic;font-weight:500}
.players{font-size:11px;line-height:1.35;font-weight:750;color:#334155}
.player{display:block}
.players.r{text-align:right}
.gamepts{margin-top:4px;font-size:9px;color:var(--mut);font-weight:800}
.stoppedbadge{display:table;margin:4px auto 0;padding:3px 8px;border-radius:999px;background:#e30613;color:#fff;font-size:9px;font-weight:900;line-height:1.2}

/* Phase finale : lecture verticale 4 -> 2 -> 1 */
.finals-shell{position:relative;padding:4px 0 12px}
.finals-hero{text-align:center;margin:4px 0 22px}
.finals-eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--r);font-size:10px;font-weight:950;letter-spacing:.14em;text-transform:uppercase}
.finals-eyebrow:before,.finals-eyebrow:after{content:"";width:32px;height:2px;background:var(--r)}
.finals-hero h2{margin:6px 0 3px;color:var(--b-dark);font-size:clamp(24px,3vw,34px);letter-spacing:-.025em}
.finals-hero p{margin:0;color:var(--mut);font-size:12px}
.final-stage{position:relative;margin:0 auto 24px}
.final-stage:after{content:"";position:absolute;left:50%;bottom:-24px;width:2px;height:24px;background:linear-gradient(var(--b),var(--r));opacity:.35}
.final-stage:last-child:after{display:none}
.stage-head{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 11px}
.stage-head:before,.stage-head:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line))}
.stage-head:after{background:linear-gradient(90deg,var(--line),transparent)}
.stage-title{min-width:150px;text-align:center;background:var(--b-dark);color:#fff;border-radius:999px;padding:7px 15px;font-size:11px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 4px 12px rgba(8,47,87,.14)}
.stage-count{font-size:9px;opacity:.72;margin-left:4px}
.quarter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;max-width:1180px;margin:auto}
.semi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:980px;margin:auto}
.final-one{max-width:690px;margin:auto;position:relative}
.final-one:before{content:"FINALE";position:absolute;z-index:2;right:13px;top:-10px;background:var(--r);color:#fff;border-radius:999px;padding:4px 9px;font-size:9px;font-weight:950;letter-spacing:.08em;box-shadow:0 4px 10px rgba(198,40,61,.22)}
.final-one .match{border:2px solid var(--b);box-shadow:0 12px 30px rgba(8,47,87,.14)}
.final-one .mh{background:linear-gradient(135deg,#f4f8fc,#fff)}
.final-one .total{background:linear-gradient(135deg,var(--b-dark),var(--b-mid));font-size:24px}
.final-one .team{font-size:16px}
.final-one .win{background:linear-gradient(90deg,var(--g2),#f6fbf8);border-left-width:5px}
footer{text-align:center;color:var(--mut);font-size:10px;padding:0 15px 25px}
@media(max-width:850px){
 .header-brand{align-items:flex-start}.header-logo{width:120px;max-height:68px;margin-left:auto}
 .grid,.quarter-grid,.semi-grid{grid-template-columns:1fr}
 .rankingbox{overflow-x:auto}.rankingtable{min-width:920px}
 .state{width:100%;margin-left:0}.game{grid-template-columns:1fr 78px 1fr}
 .finals-hero{margin-bottom:17px}.final-stage{margin-bottom:20px}.final-stage:after{bottom:-20px;height:20px}
}

  const aWins=g.decided&&g.scoreA!=null&&g.scoreB!=null&&Number.isFinite(a)&&Number.isFinite(b)&&a===13&&a>b;
  const bWins=g.decided&&g.scoreA!=null&&g.scoreB!=null&&Number.isFinite(a)&&Number.isFinite(b)&&b===13&&b>a;
  return `<span class="${aWins?'game-winning-score':''}">${esc(g.scoreA??'—')}</span> – <span class="${bWins?'game-winning-score':''}">${esc(g.scoreB??'—')}</span>`;
 })();
 const pa=(g.playersA||[]).map(renderGamePlayer).join("") || '<span class="waiting">Joueurs en attente</span>';
 const pb=(g.playersB||[]).map(renderGamePlayer).join("") || '<span class="waiting">Joueurs en attente</span>';
 return `<div class="game ${g.invalid?"invalid-game":""}">
   <div class="players">${pa}</div>
   <div class="mid">${esc(g.label)}<br>${sc}${g.invalid?'<span class="pts">Score invalide</span>':!g.stopped&&(!g.decided||(g.scoreA!=null&&g.scoreB!=null&&Number(g.scoreA)===Number(g.scoreB)))&&g.scoreA!=null&&g.scoreB!=null?'<span class="pts">En cours</span>':""}${g.stopped?'<span class="stoppedbadge">Partie arrêtée</span>':""}</div>
   <div class="players r">${pb}</div>
 </div>`;
}
const encounterOpen=new Map();
function visibleGames(m){
 const games=m.games||[];
 const named=g=>[...(g.playersA||[]),...(g.playersB||[])].some(n=>String(n??'').trim());
 const triples=games.some(g=>g.value===6&&named(g));
 const doubles=triples||games.some(g=>g.value===4&&named(g));
 return games.filter(g=>g.value===2||(g.value===4&&doubles)||(g.value===6&&triples));
}
document.addEventListener('toggle',e=>{if(e.target.matches?.('details.encounter-details'))encounterOpen.set(e.target.dataset.encounter,e.target.open)},true);
function match(m,i){
 let A=m.teamA?teamLink(m.teamA):'<span class="waiting">En attente</span>',B=m.teamB?teamLink(m.teamB):'<span class="waiting">En attente</span>';
 let msg=m.winner?`<div class="win">✓ ${esc(m.winner)} remporte la rencontre${m.tieBreakWinner?(()=>{
 const winnerIsA=m.winner===m.tieBreakTeamA;
 const ws=winnerIsA?m.tieBreakScoreA:m.tieBreakScoreB;
 const ls=winnerIsA?m.tieBreakScoreB:m.tieBreakScoreA;
 const opponent=winnerIsA?m.tieBreakTeamB:m.tieBreakTeamA;
 return ` au tir de départage${ws!==null&&ws!==undefined?" · "+esc(ws)+" points":""}${ls!==null&&ls!==undefined?" contre "+esc(ls)+" points pour "+esc(opponent||"l’adversaire"):""}`;
})():""}</div>`:(m.draw?'<div class="win">Rencontre nulle</div>':'');
 const key=JSON.stringify([active,m.teamA,m.teamB,i]);
 const compactable=Number(m.totalA)>=19||Number(m.totalB)>=19||(Number(m.totalA)===18&&Number(m.totalB)===18);
 const teams=`<div class="teams"><div class="team ${m.winner===m.teamA?"winner":""}">${A}</div><div class="total">${m.totalA} – ${m.totalB}</div><div class="team r ${m.winner===m.teamB?"winner":""}">${B}</div></div>`;
 const extras=`${msg}${active!==5&&m.warning?`<div class="match-warning">${esc(m.warning)}</div>`:""}${active!==5&&m.seedA?`<div class="small">${esc(m.seedA)} — ${esc(m.seedB)}</div>`:""}`;
 const games=`<div class="games">${visibleGames(m).map(game).join("")}</div>`;
 if(compactable){
  const open=encounterOpen.get(key)!==false;
  return `<article class="match ${m.finished?"done":""}"><details class="encounter-details" data-encounter="${esc(key)}" ${open?'open':''}><summary class="mh" aria-label="Afficher ou réduire la rencontre">${teams}</summary><div class="encounter-expanded"><div class="mh"><div class="small">RENCONTRE ${i+1}</div>${extras}</div>${games}</div></details></article>`;
 }
 return `<article class="match ${m.finished?"done":""}"><div class="mh"><div class="small">RENCONTRE ${i+1}</div>${teams}${extras}</div>${games}</article>`;
}
function ranking(g){
 return `<div class="rankingbox"><div class="rankingtitle">Classement de la poule</div><div class="rankingtable">
   <div class="rankingrow rankinghead"><div>Rang</div><div>Équipe</div><div>J</div><div>V</div><div>N</div><div>D</div><div>Diff.</div><div>Pts</div><div>Confrontation directe</div><div>Tir de départage</div></div>
   ${g.ranking.map((r,i)=>`<div class="rankingrow${r.qualified?" ranking-qualified":""}"><div class="ranknum">${r.unresolved?"=":r.rank}</div><div class="rankteam">${teamLink(r.team)}${r.qualified?'<small class="qual-badge">Qualifié</small>':""}</div><div>${r.played}</div><div>${r.wins}</div><div>${r.draws}</div><div>${r.losses}</div><div>${r.diff>=0?"+":""}${r.diff}</div><div class="rankpts">${r.matchPoints}</div><div>${r.directConfrontation?"Confrontation directe":""}</div><div>${r.tieBreak?`Tir de départage${r.tieBreakScore!==null&&r.tieBreakScore!==undefined?" · "+r.tieBreakScore+" points":""}`:""}</div></div>`).join("")}
 </div></div>`;
}
function groupView(g){
 return `<div class="group-summary">${esc(g.name)}</div>`+ranking(g)+g.rounds.filter(rr=>rr.round===1||g.rounds.find(prev=>prev.round===rr.round-1)?.matches.some(m=>!!m.winner)).map(rr=>`<div class="round"><h2>${rr.round}<sup>${rr.round===1?"er":"e"}</sup> tour</h2><span class="tag">2 rencontres</span></div><div class="grid">${rr.matches.map(match).join("")}</div>`).join("");
}
function finals(){
 const f=data.finals;
 return `<div class="finals-shell">
   <div class="finals-hero">
     <div class="finals-eyebrow">CNC Vétérans</div>
     <h2>Phases finales</h2>
     <p>Tableau final · quarts de finale, demi-finales et finale</p>
     ${f.final && f.final[0] && f.final[0].winner ? `<div class="champion-banner"><div class="champion-label">Vainqueur du CNC Vétérans</div><div class="champion-name">🏆 ${teamLink(f.final[0].winner)}</div></div>` : ""}
   </div>
   <section class="final-stage">
     <div class="stage-head"><div class="stage-title">1/4 de finale <span class="stage-count">4 rencontres</span></div></div>
     <div class="quarter-grid">${f.quarters.map(match).join("")}</div>
   </section>
   <section class="final-stage">
     <div class="stage-head"><div class="stage-title">1/2 finale <span class="stage-count">2 rencontres</span></div></div>
     <div class="semi-grid">${f.semis.map(match).join("")}</div>
   </section>
   <section class="final-stage">
     <div class="stage-head"><div class="stage-title">Finale <span class="stage-count">1 rencontre</span></div></div>
     <div class="final-one">${f.final.map(match).join("")}</div>
   </section>
 </div>`;
}
function render(){if(!data){document.getElementById("view").innerHTML='<div class="waiting">Chargement des résultats…</div>';return}document.getElementById("view").innerHTML=(active!==0?`<div class="mobile-search-panel team-search-panel"><label for="team-search-input">Rechercher une équipe ou un joueur</label><input id="team-search-input" type="search" autocomplete="off" placeholder="Nom de l’équipe ou du joueur" aria-label="Rechercher une équipe ou un joueur"><div id="team-search-results" aria-live="polite"></div></div>`:"")+(active===0?teamsView():active<=4?groupView(data.groups[active-1]):finals())}

function teamLink(name){
 const n=String(name||'');
 const known=(data?.teamCompositions||[]).some(t=>t.name.trim().toLocaleLowerCase('fr')===n.trim().toLocaleLowerCase('fr'));
 return known?`<button type="button" class="team-link" data-team="${esc(n)}" title="Voir la composition de ${esc(n)}">${esc(n)}</button>`:esc(n);
}
function teamCard(t){
 return `<div class="team-roster"><h3>${esc(t.name)}</h3><div class="roster-label">Joueurs</div>${t.players.length?`<ol>${t.players.map(p=>{const names=String(p).split(',').map(x=>x.trim()).filter(Boolean);return names.length===2?`<li>${esc(names[0])} <span class="roster-replaced">[Remplacé]</span><div>${esc(names[1])} <span class="roster-substitute">[Remplaçant]</span></div></li>`:`<li>${esc(p)}</li>`}).join('')}</ol>`:'<p class="roster-empty">Composition non renseignée</p>'}${t.coaches.length?`<div class="roster-label">Coach${t.coaches.length>1?'s':''}</div><p>${t.coaches.map(esc).join(' · ')}</p>`:''}</div>`;
}
function teamsView(){
 const teams=[...(data.teamCompositions||[])].sort((a,b)=>a.name.localeCompare(b.name,'fr',{sensitivity:'base'}));
 return `<section class="teams-directory"><h2>Composition des équipes</h2><div class="team-search-panel"><label for="team-search-input">Rechercher une équipe ou un joueur</label><input id="team-search-input" type="search" autocomplete="off" placeholder="Nom de l’équipe ou du joueur" aria-label="Rechercher une équipe ou un joueur"><div id="team-search-results" aria-live="polite"></div></div><div class="teams-directory-grid">${teams.map(t=>`<button class="teams-directory-item" data-team="${esc(t.name)}">${esc(t.name)}<span>${t.players.length} joueur${t.players.length>1?'s':''}</span></button>`).join('')}</div></section>`;
}

// Recherche dans les compositions et localisation dans les rencontres existantes.
const normalizeSearch=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('fr').replace(/\s+/g,' ').trim();
function teamProgress(name){
 const key=normalizeSearch(name), history=[];
 (data?.groups||[]).forEach((g,gi)=>(g.rounds||[]).forEach((r,ri)=>(r.matches||[]).forEach((m,mi)=>{
  if(normalizeSearch(m.teamA)!==key&&normalizeSearch(m.teamB)!==key)return;
  const side=normalizeSearch(m.teamA)===key?'A':'B';
  const a=Number(m.totalA),b=Number(m.totalB);
  const valid=Number.isFinite(a)&&Number.isFinite(b);
  history.push({tab:gi+1,index:(g.rounds||[]).slice(0,ri).reduce((n,x)=>n+(x.matches||[]).length,0)+mi,
   stage:`Groupe ${gi+1} · ${ri+1}${ri===0?'er':'e'} tour`,opponent:side==='A'?m.teamB:m.teamA,
   score:valid?`${m.totalA} – ${m.totalB}`:'En attente',finished:!!m.finished,
   outcome:m.finished?(m.winner?(normalizeSearch(m.winner)===key?'Victoire':'Défaite'):'Match nul'):'En cours / à jouer'});
 })));
 const f=data?.finals||{};
 [['quarters','Quart de finale'],['semis','Demi-finale'],['final','Finale']].forEach(([field,stage])=>(f[field]||[]).forEach((m,mi)=>{
  if(normalizeSearch(m.teamA)!==key&&normalizeSearch(m.teamB)!==key)return;
  const side=normalizeSearch(m.teamA)===key?'A':'B';
  const index=(field==='quarters'?0:field==='semis'?(f.quarters||[]).length:(f.quarters||[]).length+(f.semis||[]).length)+mi;
  history.push({tab:5,index,stage,opponent:side==='A'?m.teamB:m.teamA,
   score:`${m.totalA} – ${m.totalB}`,finished:!!m.finished,
   outcome:m.finished?(m.winner?(normalizeSearch(m.winner)===key?'Victoire':'Défaite'):'Match nul'):'En cours / à jouer'});
 }));
 return history;
}
// Résultats individuels des parties, uniquement pour un joueur recherché.
function playerGameResults(teamName,playerName){
 const teamKey=normalizeSearch(teamName),playerKey=normalizeSearch(playerName),found=[];
 function visit(m,stage){
  const isA=normalizeSearch(m.teamA)===teamKey,isB=normalizeSearch(m.teamB)===teamKey;
  if(!isA&&!isB)return;
  (m.games||[]).forEach(g=>{
   const a=(g.playersA||[]).some(p=>String(p).split(',').some(n=>normalizeSearch(n.trim())===playerKey));
   const b=(g.playersB||[]).some(p=>String(p).split(',').some(n=>normalizeSearch(n.trim())===playerKey));
   if(!a&&!b)return;
   const mine=a?g.scoreA:g.scoreB,theirs=a?g.scoreB:g.scoreA;
   const x=mine===null||mine===undefined||mine===''?NaN:Number(mine);
   const y=theirs===null||theirs===undefined||theirs===''?NaN:Number(theirs);
   const scored=Number.isFinite(x)&&Number.isFinite(y);
   const complete=!!g.decided;
   const result=g.stopped?'Partie arrêtée':!scored?'Score en attente':!complete?'En cours':x>y?'Victoire':x<y?'Défaite':'Match nul';
   found.push({stage,label:g.label||'Partie',opponent:isA?m.teamB:m.teamA,score:scored?`${x} – ${y}`:'—',result,complete});
  });
 }
 (data?.groups||[]).forEach((g,gi)=>(g.rounds||[]).forEach((r,ri)=>(r.matches||[]).forEach(m=>visit(m,`Groupe ${gi+1} · ${ri+1}${ri===0?'er':'e'} tour`))));
 const f=data?.finals||{};
 [['quarters','Quart de finale'],['semis','Demi-finale'],['final','Finale']].forEach(([field,stage])=>(f[field]||[]).forEach(m=>visit(m,stage)));
 return found;
}
function searchTeams(q){
 const box=document.getElementById('team-search-results');if(!box)return;
 const term=normalizeSearch(q);if(!term){box.innerHTML='';return;}
 const matches=(data?.teamCompositions||[]).map(t=>({team:t,players:(t.players||[]).flatMap(p=>String(p).split(',').map(n=>n.trim()).filter(Boolean)).filter(p=>normalizeSearch(p).includes(term))})).filter(x=>normalizeSearch(x.team.name).includes(term)||x.players.length);
 if(!matches.length){box.innerHTML='<p class="search-empty">Aucune équipe ni aucun joueur trouvé.</p>';return;}
 box.innerHTML=matches.map(({team,players})=>{
  const history=teamProgress(team.name),current=[...history].reverse().find(h=>!h.finished)||history[history.length-1];
  const completed=history.filter(h=>h.finished);
  const summary=completed.length?completed.map(h=>`<li>${esc(h.stage)} : ${esc(h.outcome)} (${esc(h.score)})${h.opponent?' contre '+esc(h.opponent):''}</li>`).join(''):'<li>Aucune rencontre terminée renseignée.</li>';
  const playerSummary=players.map(player=>{
   const games=playerGameResults(team.name,player);
   const lines=games.length?games.map(g=>`<li>${esc(g.stage)} · ${esc(g.label)} : ${esc(g.result)} (${esc(g.score)})${g.opponent?' contre '+esc(g.opponent):''}</li>`).join(''):'<li>Aucune partie individuelle identifiée pour ce joueur.</li>';
   return `<details class="search-player-results"><summary>Parties de ${esc(player)} (${games.length})</summary><ul>${lines}</ul></details>`;
  }).join('');
  return `<article class="search-result"><div class="search-result-top"><strong>${esc(team.name)}</strong>${current?`<button type="button" class="search-go" data-go-tab="${current.tab}" data-go-index="${current.index}">Y aller →</button>`:''}</div>${players.length?`<div class="search-players">Joueur${players.length>1?'s':''} : ${players.map(esc).join(' · ')}</div>`:''}<p><b>Situation :</b> ${current?esc(current.stage)+' — '+esc(current.outcome):'Aucune rencontre identifiée'}</p><details><summary>Récapitulatif des résultats (${completed.length})</summary><ul>${summary}</ul></details>${playerSummary}</article>`;
 }).join('');
}
document.addEventListener('input',e=>{if(e.target.id==='team-search-input')searchTeams(e.target.value)});
document.addEventListener('click',e=>{
 const go=e.target.closest('[data-go-tab][data-go-index]');if(!go)return;
 const tab=Number(go.dataset.goTab),idx=Number(go.dataset.goIndex);
 if(!Number.isInteger(tab)||!Number.isInteger(idx))return;
 active=tab;try{sessionStorage.setItem("cncv_active_tab",String(active))}catch(e){}tabs();render();
 const target=document.querySelectorAll('#view article.match')[idx];
 if(target){target.scrollIntoView({behavior:'smooth',block:'center'});target.classList.add('search-match-focus');setTimeout(()=>target.classList.remove('search-match-focus'),4500)}
});

function openTeam(name){
 const t=(data?.teamCompositions||[]).find(x=>x.name.trim().toLocaleLowerCase('fr')===name.trim().toLocaleLowerCase('fr'));
 if(!t)return;
 const modal=document.getElementById('team-modal');
 document.getElementById('team-modal-content').innerHTML=teamCard(t);
 modal.hidden=false;
 document.body.style.overflow='hidden';
 document.getElementById('team-modal-close').focus();
}
function closeTeam(){document.getElementById('team-modal').hidden=true;document.body.style.overflow='';}
document.addEventListener('click',e=>{
 const link=e.target.closest('[data-team]');
 if(link){e.preventDefault();openTeam(link.dataset.team);return;}
 if(e.target.id==='team-modal'||e.target.closest('#team-modal-close'))closeTeam();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('team-modal').hidden)closeTeam()});

function jsonp(url){
 return new Promise((resolve,reject)=>{const cb="cncv_"+Date.now()+"_"+Math.random().toString(36).slice(2),s=document.createElement("script");window[cb]=x=>{cleanup();resolve(x)};function cleanup(){clearTimeout(timeout);delete window[cb];s.remove()}s.onerror=()=>{cleanup();reject(new Error("Impossible de joindre Apps Script"))};s.src=url+(url.includes("?")?"&":"?")+"callback="+cb+"&_="+Date.now();document.head.appendChild(s);const timeout=setTimeout(()=>{if(window[cb]){cleanup();reject(new Error("Délai de connexion dépassé"))}},12000)})
}
const CACHE_KEY="cncv_last_reliable_v1";
function saveReliableData(x){
 try{localStorage.setItem(CACHE_KEY,JSON.stringify({savedAt:Date.now(),data:x}))}catch(e){}
}
function readReliableData(){
 try{
  const raw=localStorage.getItem(CACHE_KEY);
  if(!raw)return null;
  const cached=JSON.parse(raw);
  return cached&&cached.data&&cached.data.ok?cached:null;
 }catch(e){return null}
}
function connectionState(ok){
 const dot=document.getElementById("conn-dot");
 if(dot){dot.className="connection-dot "+(ok?"ok":"ko");dot.title=ok?"Connexion active":"Connexion indisponible"}
}
function updateStateTime(ts){
 document.getElementById("state").textContent="Mis à jour à "+new Date(ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}

// Chronomètre général : recalage sur l'heure du serveur à chaque réception.
let clockOffset=0,clockSync=0,clockInfo=null;
function syncGlobalClock(payload){
 if(!payload)return;
 clockInfo=payload.clock||null;
 if(typeof payload.serverNow==='number'){
   clockOffset=payload.serverNow-Date.now();
   clockSync=Date.now();
 }
 paintGlobalClock();
}
function paintGlobalClock(){
 const root=document.getElementById('global-clock');
 if(!root)return;
 const c=clockInfo;
 let extra=root.querySelector('.clock-extra');if(!extra){extra=document.createElement('div');extra.className='clock-extra';root.appendChild(extra)}extra.textContent=c?.info||'';
 const showResume=!!(c&&c.configured&&c.showResume&&!c.running&&!c.paused);
 const kicker=root.querySelector('.clock-kicker');if(kicker)kicker.textContent=c&&c.showResume?'CNC Vétérans':'CNC VÉTÉRANS — TEMPS RESTANT';
 root.hidden=!c||!c.configured||(!c.running&&!showResume);
 if(root.hidden)return;
 const digits=root.querySelector('.clock-digits');
 let resume=root.querySelector('.clock-resume');
 if(!resume){
   resume=document.createElement('div');
   resume.className='clock-resume';
   resume.style.cssText='font-size:clamp(24px,4vw,35px);font-weight:800;line-height:1.3;margin:15px auto;color:#fff';
   digits.insertAdjacentElement('afterend',resume);
 }
 digits.style.display=showResume?'none':'flex';
 resume.hidden=!showResume;
 const status=document.getElementById('clock-status');
 if(showResume){
   resume.textContent='Reprise à '+(c.resumeTime||'--:--');
   status.textContent='';
   status.className='clock-status paused';
   return;
 }
 let remaining=0;
 if(c.paused)remaining=Math.max(0,Number(c.remainingMs)||0);
 else if(c.endAt)remaining=Math.max(0,c.endAt-(Date.now()+clockOffset));
 const total=Math.ceil(remaining/1000),hours=Math.floor(total/3600),mins=Math.floor(total%3600/60),secs=total%60;
 const pad=n=>String(n).padStart(2,'0');
 document.getElementById('clock-h').textContent=pad(hours);
 document.getElementById('clock-m').textContent=pad(mins);
 document.getElementById('clock-s').textContent=pad(secs);
 status.textContent=c.paused?'En pause':remaining<=0?'Temps écoulé':'Rencontre en cours';
 status.className='clock-status'+(c.paused?' paused':remaining<=0?' ended':'');
}
setInterval(paintGlobalClock,1000);

let loading=false;
async function load(){if(loading)return;loading=true;try{await loadOnce()}finally{loading=false}}
async function loadOnce(){
 const st=document.getElementById("state"),er=document.getElementById("error");
 er.style.display="none";
 if(!API_URL.startsWith("https://script.google.com/")){
  const cached=readReliableData();
  connectionState(false);
  if(cached){data=cached.data;updateStateTime(cached.savedAt);syncGlobalClock(data);render()}
  else{er.style.display="block";er.textContent="Connexion à configurer : collez l’URL /exec de votre application Web dans la constante API_URL du fichier HTML. Consultez le guide joint.";st.textContent="Connexion à configurer"}
  return;
 }
 try{
  const x=await jsonp(API_URL);
  if(!x||!x.ok)throw new Error("Réponse API invalide");
  data=x;
  if(x.warnings?.length){er.style.display="block";er.textContent=x.warnings.join(" · ")}
  const now=Date.now();
  saveReliableData(x);
  updateStateTime(now);
  connectionState(true);
  syncGlobalClock(data);
  render();
 }catch(e){
  const cached=readReliableData();
  connectionState(false);
  if(cached){
   data=cached.data;
   updateStateTime(cached.savedAt);
   er.style.display="none";
   syncGlobalClock(data);
   render();
  }else{
   er.style.display="block";
   er.textContent="Connexion impossible lors du premier chargement";
   st.textContent="Connexion impossible";
  }
 }
}
tabs();
const initialCache=readReliableData();
if(initialCache){data=initialCache.data;updateStateTime(initialCache.savedAt);connectionState(false);syncGlobalClock(data);render()}else{render()}
load();timer=setInterval(()=>{if(auto)load()},30000);
</script></body></html>
